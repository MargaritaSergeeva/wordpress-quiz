name: wordpress-quiz

x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
  WORDPRESS_DB_USER: ${DB_USER:-wordpress}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Run python3 scripts/init-env.py first}
  WPQ_CRM_URL: http://mock-crm:8080/leads
  WPQ_CRM_TOKEN: ${WPQ_CRM_TOKEN:?Run python3 scripts/init-env.py first}
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_ENVIRONMENT_TYPE', '${WP_ENVIRONMENT_TYPE:-local}');
    define('DISALLOW_FILE_EDIT', true);

services:
  mock-crm:
    image: python:3.12-alpine
    restart: unless-stopped
    command: [python, /app/server.py]
    environment:
      CRM_TOKEN: ${WPQ_CRM_TOKEN:?CRM token required}
    volumes:
      - ./mock-crm:/app:ro
      - crm_data:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Database password required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Root password required}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  wordpress:
    image: wordpress:7.1.0-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT:-8088}:80"
    environment: *wordpress-env
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/plugins/wordpress-quiz:/var/www/html/wp-content/plugins/wordpress-quiz
      - ./wp-content/themes/quiz-demo:/var/www/html/wp-content/themes/quiz-demo
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://localhost/wp-admin/install.php]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  wpcli:
    image: wordpress:cli-2.12.0-php8.3
    profiles: [tools]
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      <<: *wordpress-env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WP_URL: ${WP_URL:-http://localhost:8088}
      WP_TITLE: ${WP_TITLE:-WordPress Quiz}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-quiz_admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.test}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:?Admin password required}
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/plugins/wordpress-quiz:/var/www/html/wp-content/plugins/wordpress-quiz
      - ./wp-content/themes/quiz-demo:/var/www/html/wp-content/themes/quiz-demo
      - ./scripts:/project-scripts:ro

volumes:
  crm_data:
  db_data:
  wordpress_data:
